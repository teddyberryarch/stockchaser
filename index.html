<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tebestck 대시보드</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:20px 16px 48px}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:24px;font-weight:600;margin-bottom:4px}
  .sub{font-size:15px;color:#8b949e;margin-bottom:20px}
  .card{background:#161b22;border-radius:16px;padding:18px;margin-bottom:16px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .label{font-size:20px;font-weight:600}
  .tier{font-size:15px;font-weight:600;border:1px solid;border-radius:8px;padding:4px 10px}
  .hold{font-size:16px;color:#c9d1d9;margin-bottom:12px}
  .hold b{color:#e6edf3}
  .grid{display:flex;gap:10px;padding:12px 0;border-top:1px solid #272d36;border-bottom:1px solid #272d36}
  .grid>div{flex:1}
  .k{font-size:15px;color:#8b949e}
  .v{font-size:19px;font-weight:600;margin-top:2px}
  .lev{font-size:17px;margin:14px 0 10px}
  .trig{display:flex;gap:8px;margin-bottom:10px}
  .tg{flex:1;background:#0d1117;border-radius:8px;padding:8px 6px;text-align:center}
  .tgk{font-size:14px;color:#8b949e}
  .tgv{font-size:16px;font-weight:600;margin-top:2px}
  .act{background:#0d1117;border-radius:12px;padding:14px;font-size:17px}
  .act.none{color:#8b949e}
  .actrow{margin-bottom:6px}
  .actsum{font-size:16px;color:#8b949e;margin-top:6px}
  .err{color:#f6435b;font-size:17px;margin-top:8px}
  .editbtn{background:none;border:1px solid #30363d;color:#8b949e;border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer;margin-top:12px}
  .editbox{margin-top:12px;padding:14px;background:#0d1117;border-radius:12px;display:none}
  .editbox.open{display:block}
  .frow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .frow label{font-size:15px;color:#8b949e}
  .frow input{width:140px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;padding:8px 10px;font-size:17px;text-align:right}
  .savebtn{width:100%;background:#238636;border:none;color:#fff;border-radius:8px;padding:10px;font-size:17px;font-weight:600;cursor:pointer;margin-top:4px}
  .foot{font-size:15px;color:#8b949e;line-height:1.6;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>tebestck 대시보드</h1>
  <div class="sub" id="sub">불러오는 중…</div>
  <div id="cards"></div>
  <div class="foot">시세·고점은 봇(5분 갱신). 보유값은 직접 입력(이 브라우저에 저장). 교체금액은 레버 평가액을 본주 낙폭 2배로 근사한 추정. 본장 기준·자동주문 없음.<br>※ 텔레그램 알림은 repo의 holdings.json 기준이라, 비중을 봇에도 반영하려면 holdings.json도 같이 수정.</div>
</div>
<script>
const TIER_NAME = {0:"정상",1:"폭락 1단계",2:"폭락 2단계",3:"폭락 3단계"};
const TIER_COLOR = {0:"#3fb950",1:"#ffb454",2:"#f0883e",3:"#f6435b"};

// 보유 기본값 (localStorage 없을 때)
const DEFAULTS = {
  hynix:   {label:"하이닉스", ccy:"KRW", spot_name:"SK하이닉스",      lev_name:"TIGER 하이닉스 레버",
            spot_shares:13, lev_shares:916, min_action:2000000, taxable:false, t1:10, t2:20, t3:30},
  sandisk: {label:"샌디스크", ccy:"USD", spot_name:"샌디스크",        lev_name:"TRADR 샌디스크 2배",
            spot_shares:11, lev_shares:280, min_action:1500, taxable:true, t1:15, t2:27, t3:38},
};

function loadHoldings(){
  try{
    const s = localStorage.getItem("tebestck_holdings");
    if(s){ const h = JSON.parse(s); // 누락 필드는 기본값으로 보강
      for(const k in DEFAULTS) h[k] = Object.assign({}, DEFAULTS[k], h[k]||{});
      return h;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function saveHoldings(h){ try{ localStorage.setItem("tebestck_holdings", JSON.stringify(h)); }catch(e){} }

let HOLD = loadHoldings();
let LIVE = {};   // data.json (시세)

const fmtW = (a)=> Math.round(a).toLocaleString("ko-KR")+"원";
function tierTarget(dd,t1,t2,t3){
  if(dd<=-t3) return [3,60];
  if(dd<=-t2) return [2,50];
  if(dd<=-t1) return [1,40];
  return [0,30];
}

function compute(name){
  const h = HOLD[name], L = LIVE[name];
  if(!L || L.error) return {error: L? L.error : "시세 없음", label:h.label};
  const fx = LIVE._fx || 1385;            // USD/KRW
  const k = (h.ccy==="USD") ? fx : 1;     // 표시·계산용 원화 환산계수
  const spot_p = L.spot_p, high10 = L.high10, lev_p = L.lev_p;   // 원래 통화(달러/원)
  const dd = high10 ? (spot_p-high10)/high10*100 : 0;  // 판정은 원래 통화 기준(환율 노이즈 X)
  const [tier,target] = tierTarget(dd, h.t1, h.t2, h.t3);
  // 레버 시세도 봇이 야후에서 가져옴 → 실제값으로 정확히 (추정 아님)
  const spot_val = spot_p * h.spot_shares * k;
  const lev_est  = lev_p  * h.lev_shares  * k;
  const pool = spot_val + lev_est;
  const lev_pct = pool ? lev_est/pool*100 : 0;
  const min_action_krw = h.min_action * k;
  const delta = pool*target/100 - lev_est;
  let action=null;
  if(delta > min_action_krw){ const amt=Math.min(delta,spot_val); action={dir:"up",amt,sell:h.spot_name,buy:h.lev_name}; }
  else if(delta < -min_action_krw){ const amt=Math.min(-delta,lev_est); action={dir:"down",amt,sell:h.lev_name,buy:h.spot_name}; }
  const trig = [
    {lv:40, p:high10*(1-h.t1/100)*k, t:h.t1},
    {lv:50, p:high10*(1-h.t2/100)*k, t:h.t2},
    {lv:60, p:high10*(1-h.t3/100)*k, t:h.t3},
  ];
  return {label:h.label, taxable:h.taxable, dd, tier, target, lev_pct, pool, action, trig,
          spot_p_krw: spot_p*k, high10_krw: high10*k,
          spot_shares:h.spot_shares, lev_shares:h.lev_shares};
}

function render(){
  const ts = LIVE._ts ? new Date(LIVE._ts*1000).toLocaleString("ko-KR") : "-";
  document.getElementById("sub").textContent = "시세 갱신 "+ts+" · 60초마다 자동";
  let html="";
  for(const name of Object.keys(HOLD)){
    const r = compute(name);
    if(r.error){
      html += `<div class="card"><div class="label">${r.label}</div><div class="err">시세 조회 실패: ${r.error}</div>
        ${editBox(name)}</div>`;
      continue;
    }
    const col = TIER_COLOR[r.tier], ddcol = r.dd<0?"#3d7eff":"#f6435b";
    let act;
    if(r.action){
      const tax = r.taxable ? "⚠️ 22% 과세누적" : "비과세";
      act = `<div class="act"><div class="actrow">▶ ${r.action.sell} <b>${fmtW(r.action.amt)}</b>어치 매도</div>
             <div class="actrow">▶ ${r.action.buy} <b>${fmtW(r.action.amt)}</b>어치 매수</div>
             <div class="actsum">≈ ${fmtW(r.action.amt)} 교체 · ${tax}</div></div>`;
    } else act = `<div class="act none">조정 불필요 — 유지</div>`;
    html += `<div class="card">
      <div class="top"><div class="label">${r.label}</div>
        <div class="tier" style="color:${col};border-color:${col}">${TIER_NAME[r.tier]}</div></div>
      <div class="hold">보유: 현물 <b>${r.spot_shares}주</b> · 레버 <b>${r.lev_shares}주</b> · 풀 ${fmtW(r.pool)}</div>
      <div class="grid">
        <div><div class="k">본주</div><div class="v">${fmtW(r.spot_p_krw)}</div></div>
        <div><div class="k">10일고점</div><div class="v">${fmtW(r.high10_krw)}</div></div>
        <div><div class="k">고점대비</div><div class="v" style="color:${ddcol}">${r.dd>=0?"+":""}${r.dd.toFixed(1)}%</div></div>
      </div>
      <div class="lev">레버 약 <b>${Math.round(r.lev_pct)}%</b> → 목표 <b style="color:${col}">${r.target}%</b></div>
      <div class="trig">${r.trig.map(t=>`<div class="tg"><div class="tgk">-${t.t}% → ${t.lv}%</div><div class="tgv">${fmtW(t.p)}</div></div>`).join("")}</div>
      ${act}
      <button class="editbtn" onclick="toggle('${name}')">보유 수정</button>
      ${editBox(name)}
    </div>`;
  }
  document.getElementById("cards").innerHTML = html;
}

function editBox(name){
  const h = HOLD[name];
  return `<div class="editbox" id="edit_${name}">
    <div class="frow"><label>현물 주수</label><input id="${name}_ss" type="number" value="${h.spot_shares}"></div>
    <div class="frow"><label>레버 주수</label><input id="${name}_ls" type="number" value="${h.lev_shares}"></div>
    <button class="savebtn" onclick="save('${name}')">저장</button>
    <div style="font-size:14px;color:#8b949e;margin-top:8px">주수만 입력하면 됨. 시세(현물·레버)는 봇이 야후에서 자동으로 가져와 계산.</div>
  </div>`;
}
function toggle(name){ document.getElementById("edit_"+name).classList.toggle("open"); }
function save(name){
  HOLD[name].spot_shares = Number(document.getElementById(name+"_ss").value);
  HOLD[name].lev_shares  = Number(document.getElementById(name+"_ls").value);
  saveHoldings(HOLD);
  render();
}

async function loadData(){
  try{
    const res = await fetch("data.json?t="+Date.now());
    LIVE = await res.json();
  }catch(e){ LIVE = {}; document.getElementById("sub").textContent="data.json 로드 실패 (봇 첫 실행 전일 수 있음)"; }
  render();
}
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
